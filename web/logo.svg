<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Madbus">
  <defs>
    <linearGradient id="mb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17293f"/>
      <stop offset="1" stop-color="#0b1826"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#mb-bg)" stroke="rgba(255,255,255,0.06)"/>

  <!-- circuit traces feeding into the gear -->
  <g stroke="#2f93ea" stroke-width="3.4" stroke-linecap="round">
    <line x1="21" y1="32" x2="44" y2="32"/>
    <line x1="21" y1="44" x2="44" y2="44"/>
    <line x1="21" y1="56" x2="44" y2="56"/>
    <line x1="21" y1="68" x2="44" y2="68"/>
  </g>
  <g fill="#2f93ea">
    <circle cx="18" cy="32" r="3.4"/>
    <circle cx="18" cy="44" r="3.4"/>
    <circle cx="18" cy="56" r="3.4"/>
    <circle cx="18" cy="68" r="3.4"/>
  </g>

  <!-- gear -->
  <g fill="#f5a11f">
    <rect x="58.5" y="20.5" width="11" height="14" rx="3" transform="rotate(0 64 52)"/>
    <rect x="58.5" y="20.5" width="11" height="14" rx="3" transform="rotate(45 64 52)"/>
    <rect x="58.5" y="20.5" width="11" height="14" rx="3" transform="rotate(90 64 52)"/>
    <rect x="58.5" y="20.5" width="11" height="14" rx="3" transform="rotate(135 64 52)"/>
    <rect x="58.5" y="20.5" width="11" height="14" rx="3" transform="rotate(180 64 52)"/>
    <rect x="58.5" y="20.5" width="11" height="14" rx="3" transform="rotate(225 64 52)"/>
    <rect x="58.5" y="20.5" width="11" height="14" rx="3" transform="rotate(270 64 52)"/>
    <rect x="58.5" y="20.5" width="11" height="14" rx="3" transform="rotate(315 64 52)"/>
    <circle cx="64" cy="52" r="15" fill="none" stroke="#f5a11f" stroke-width="7"/>
    <!-- angry eyes -->
    <rect x="53.5" y="48.5" width="9" height="5" rx="2.5" transform="rotate(18 58 51)"/>
    <rect x="65.5" y="48.5" width="9" height="5" rx="2.5" transform="rotate(-18 70 51)"/>
  </g>
</svg>
